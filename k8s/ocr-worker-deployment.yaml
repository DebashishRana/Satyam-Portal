apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker
  labels:
    app: ocr-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ocr-worker
  template:
    metadata:
      labels:
        app: ocr-worker
    spec:
      containers:
        - name: ocr-worker
          image: satyam/ocr-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SARVAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: satyam-secrets
                  key: sarvam-api-key
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: satyam-secrets
                  key: jwt-secret
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: satyam-secrets
                  key: encryption-key
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
