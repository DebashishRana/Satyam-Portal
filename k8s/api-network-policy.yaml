apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: evaluation-api-restricted
spec:
  podSelector:
    matchLabels:
      app: evaluation-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: admin-frontend
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: ocr-worker
      ports:
        - protocol: TCP
          port: 8080
